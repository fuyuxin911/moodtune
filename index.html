<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>MoodTune · 情绪音乐可视化</title><link rel="stylesheet" href="styles.css" /></head>
<body data-mood="calm">
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="MoodTune 首页"><span class="brand-mark">♫</span>MoodTune</a><p class="tagline">Your mood. Your music.<br>Your world.</p>
    <section class="side-section"><h2>☺　选择你的心情</h2><div class="mood-list" role="radiogroup" aria-label="选择心情">
      <button class="mood-card active" data-mood="calm" role="radio" aria-checked="true"><b>☻</b><span>平静<small>Calm</small></span></button><button class="mood-card" data-mood="happy" role="radio" aria-checked="false"><b>☀</b><span>开心<small>Happy</small></span></button><button class="mood-card" data-mood="sad" role="radio" aria-checked="false"><b>☹</b><span>低落<small>Sad</small></span></button><button class="mood-card" data-mood="energetic" role="radio" aria-checked="false"><b>✹</b><span>兴奋<small>Energetic</small></span></button><button class="mood-card" data-mood="night" role="radio" aria-checked="false"><b>☾</b><span>夜晚<small>Night</small></span></button>
    </div></section>
    <section class="side-section music-section"><h2>♫　我的音乐</h2><label class="upload-zone" for="fileInput"><span>⇧</span><b>点击上传音乐</b><small>支持 MP3、WAV、OGG、M4A</small></label><input id="fileInput" type="file" accept="audio/mpeg,audio/wav,audio/ogg,audio/mp4,.mp3,.wav,.ogg,.m4a" multiple><ul id="playlist" class="playlist" aria-label="播放列表"></ul></section>
    <section class="recent-section"><h2>◷　最近播放</h2><ul id="recentList" class="recent-list"></ul></section>
  </aside>
  <main class="stage"><canvas id="visualizer" aria-label="音乐可视化画面"></canvas><header class="window-actions"><span id="audioStatus">准备就绪</span><button id="helpButton" title="快捷键">?</button></header><section class="scene-title"><p id="moodEnglish">CALM</p><h1 id="moodTitle">平静</h1><p id="moodSubtitle">让音乐带你去更远的地方</p></section><section class="visual-controls" aria-label="可视化模式"><span>VISUAL</span><button class="visual-button active" data-mode="bars">频谱</button><button class="visual-button" data-mode="circle">圆形</button><button class="visual-button" data-mode="wave">波形</button></section>
    <section class="player-panel"><div class="now-playing"><div class="cover">♫</div><div><strong id="trackName">还没有音乐</strong><span id="trackMeta">请从左侧上传本地音乐</span></div></div><div class="progress-area"><input id="progress" type="range" min="0" max="100" value="0" aria-label="播放进度"><div><span id="currentTime">00:00</span><span id="duration">00:00</span></div></div><div class="transport"><button id="previousButton" title="上一首（←）" aria-label="上一首">|◀</button><button id="playButton" class="play-button" title="播放或暂停（空格）" aria-label="播放" disabled>▶</button><button id="nextButton" title="下一首（→）" aria-label="下一首">▶|</button></div><div class="sound-controls"><button id="muteButton" title="静音（M）" aria-label="静音">♬</button><input id="volume" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="音量"><button id="loopButton" title="切换顺序／循环播放">顺序</button></div></section><p id="notice" class="notice" role="status" aria-live="polite"></p>
  </main><dialog id="helpDialog"><button class="dialog-close" aria-label="关闭">×</button><h2>快捷键</h2><p><kbd>Space</kbd> 播放／暂停　 <kbd>←</kbd><kbd>→</kbd> 切歌</p><p><kbd>M</kbd> 静音　 <kbd>V</kbd> 切换可视化</p><p><kbd>1</kbd>－<kbd>5</kbd> 切换心情</p></dialog><audio id="audio" preload="metadata"></audio><script src="app.js"></script>
</body></html>
